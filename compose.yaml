name: sch550-root

include:
  - path: db/compose.yaml # File server
  - path: supabase/compose.yaml # Supabase
  - path: monitoring/compose.yaml # Monitoring

services:
    uiprod:
        image: ghcr.io/paranoidphantom/school.550:latest
        build: .
        restart: unless-stopped
        volumes:
            - ./.env.master:/usr/src/frontend/.env
    uipreview:
        image: ghcr.io/paranoidphantom/school.550:preview
        build: .
        restart: unless-stopped
        volumes:
            - ./.env.dev:/usr/src/frontend/.env
    nginx:
        image: ghcr.io/paranoidphantom/nginx.school.550:latest
        build: ./nginx
        restart: unless-stopped
        depends_on:
            - uiprod
            - grafana
            - dozzle
            - kong
        ports:
            - 80:80
            - 443:443
        volumes:
          - /etc/letsencrypt:/etc/letsencrypt
    dozzle:
      image: amir20/dozzle:latest
      restart: unless-stopped
      environment:
        - DOZZLE_ENABLE_ACTIONS=true
        - DOZZLE_BASE=/dozzle
        - DOZZLE_AUTH_PROVIDER=simple
      volumes:
        - ./logs:/data
        - /var/run/docker.sock:/var/run/docker.sock
    watchtower:
      image: containrrr/watchtower
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      command: --interval 30