name: Master branch deployment

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: home
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Create .env file
      run: |
        echo '${{ secrets.ENV_FILE }}' > .env
    - name: Run deployment script
      run: |
        bun run deploy-master