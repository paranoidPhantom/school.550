name: Dev branch deployment

on:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: home
    environment: dev
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Create .env file
      run: |
        echo '${{ secrets.ENV_FILE }}' > .env
    - name: Run deployment script
      run: |
        bun run deploy-dev