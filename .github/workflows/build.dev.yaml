name: "Preview@dev"

on:
    push:
        branches: [dev]

jobs:
    frontend-build:
        name: Build frontend
        runs-on: ubuntu-20.04
        environment: dev

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Create .env file
              run: |
                  echo '${{ secrets.ENV_FILE }}' > .env
            - name: "Set up Docker Buildx"
              uses: docker/setup-buildx-action@v3
              with:
                  driver-opts: image=moby/buildkit:master # Use a BuildKit image
                  driver: docker-container
            - name: "Login to GitHub Container Registry"
              uses: docker/login-action@v1
              with:
                  registry: ghcr.io
                  username: ${{github.actor}}
                  password: ${{secrets.GITHUB_TOKEN}}
            - name: Build and push frontend
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/paranoidphantom/school.550:preview
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
    nginx-build:
        name: Build custom nginx
        runs-on: ubuntu-20.04
        environment: dev

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: "Set up Docker Buildx"
              uses: docker/setup-buildx-action@v3
              with:
                  driver-opts: image=moby/buildkit:master # Use a BuildKit image
                  driver: docker-container
            - name: "Login to GitHub Container Registry"
              uses: docker/login-action@v1
              with:
                  registry: ghcr.io
                  username: ${{github.actor}}
                  password: ${{secrets.GITHUB_TOKEN}}
            - name: Build and push nginx
              uses: docker/build-push-action@v6
              with:
                  context: ./nginx
                  push: true
                  tags: ghcr.io/paranoidphantom/nginx.school.550:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    db-build:
        name: Build file server
        runs-on: ubuntu-20.04
        environment: dev

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: "Set up Docker Buildx"
              uses: docker/setup-buildx-action@v3
              with:
                  driver-opts: image=moby/buildkit:master # Use a BuildKit image
                  driver: docker-container
            - name: "Login to GitHub Container Registry"
              uses: docker/login-action@v1
              with:
                  registry: ghcr.io
                  username: ${{github.actor}}
                  password: ${{secrets.GITHUB_TOKEN}}
            - name: Build and push db
              uses: docker/build-push-action@v6
              with:
                  context: ./db
                  push: true
                  tags: ghcr.io/paranoidphantom/db.school.550:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
    deploy:
        name: Deploy application
        runs-on: host
        needs: [frontend-build, nginx-build, db-build]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Create .env file
              run: |
                  echo '${{ secrets.ENV_FILE }}' > .env
            - name: Pull fresh images
              run: docker compose pull
            - name: Restart services that got updated
              run: docker compose up -d
