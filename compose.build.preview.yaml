name: sch550-build-preview

include:
  - path: db/compose.yaml # File server

services:
    uipreview:
        image: ghcr.io/paranoidphantom/school.550:preview
        build:
            context: .
            cache_from:
              - ghcr.io/paranoidphantom/school.550:preview
        restart: unless-stopped
        platform: linux/amd64
        volumes:
            - ./.env.preview:/usr/src/app/.env
    nginx:
        image: ghcr.io/paranoidphantom/nginx.school.550:latest
        build: ./nginx
        restart: unless-stopped
        platform: linux/amd64
        ports:
            - 80:80
            - 443:443
        volumes:
            - /etc/letsencrypt/live:/etc/letsencrypt/live